function waveComp(w0){
  const w=endless?((w0-1)%15)+1:Math.ceil(w0*15/WMAX);
  const q=[];
  const push=(t,n)=>{for(let i=0;i<n;i++)q.push(t)};
  if(w==1)push("grunt",6);
  else if(w==2){push("grunt",8);push("runner",2)}
  else if(w==3){push("grunt",8);push("runner",5)}
  else if(w==4){push("grunt",6);push("runner",6);push("brute",2)}
  else if(w==5){push("runner",10);push("shield",4);push("grunt",6)}
  else if(w==6){push("flyer",7);push("grunt",8);push("runner",4)}
  else if(w==7){push("brute",4);push("shield",5);push("healer",2);push("grunt",8)}
  else if(w==8){push("boss",1);push("grunt",8);push("runner",6)}
  else if(w==9){push("bat",14);push("flyer",10);push("runner",8);push("healer",2)}
  else if(w==10){push("brute",6);push("shield",6);push("healer",3);push("flyer",4)}
  else if(w==11){push("bat",16);push("runner",16);push("flyer",8);push("brute",3)}
  else if(w==12){push("dragon",1);push("shield",8);push("healer",4);push("grunt",10)}
  else if(w==13){push("flyer",14);push("brute",6);push("healer",3)}
  else if(w==14){push("dragon",1);push("brute",8);push("shield",8);push("healer",5);push("runner",10)}
  else if(w==15){push("titan",1);push("boss",1);push("healer",4);push("flyer",8);push("brute",6)}
  if(stageIdx==5&&(w==11||w==15))push("ghostking",1);
  if(w>=6&&w!=8&&w!=15)push("berserker",Math.floor((w-4)/2));
  if(w>=9&&w!=8&&w!=15)push("wraith",Math.floor((w-6)/2));
  if(w>=5&&w!=8&&w!=15)push("armored",Math.floor((w-3)/2));
  if(w>=7&&w!=8&&w!=15)push("splitter",Math.floor((w-4)/1.5));
  if(endless){const ex=Math.floor((w0-1)/15);const base=q.slice();for(let k=0;k<ex*.7+(ex>0?.3:0);k++)for(const t of base){if(Math.random()<Math.min(1,ex*.7-k+.3))q.push(t)}
    if(w0%10==0){push("titan",1+Math.floor(w0/30))}}
  // shuffle lightly so special enemies are mixed in (bosses stay first)
  const boss=q.filter(t=>EN[t].boss),rest=q.filter(t=>!EN[t].boss);
  for(let i=rest.length-1;i>0;i--){if(Math.random()<.5){const j=Math.floor(Math.random()*(i+1));[rest[i],rest[j]]=[rest[j],rest[i]]}}
  return boss.concat(rest);
}
