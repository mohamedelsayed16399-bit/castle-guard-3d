import * as THREE from "three";

// ---------- audio (synthesized, no assets) ----------
let AC=null, muted=false;
function audio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state=="suspended")AC.resume();return AC}
function sfx(kind,vol=1){
  if(muted||!audio())return;

  const N=(f0,f1,d,type="square",v=.12)=>{o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),t+d);g.gain.setValueAtTime(v*vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.start(t);o.stop(t+d+.02)};
  if(kind=="shoot")N(700,200,.09,"square",.06);
  else if(kind=="arrow")N(1400,900,.07,"sawtooth",.05);
  else if(kind=="boom")N(160,30,.4,"sawtooth",.22);
  else if(kind=="zap")N(1800,300,.12,"sawtooth",.09);
  else if(kind=="freeze")N(2400,400,.35,"sine",.12);
  else if(kind=="coin")N(900,1500,.12,"sine",.09);
  else if(kind=="hit")N(300,80,.12,"square",.12);
  else if(kind=="build")N(300,600,.15,"triangle",.12);
  else if(kind=="sell")N(600,150,.2,"triangle",.12);
  else if(kind=="leak")N(500,90,.4,"sawtooth",.25);
  else if(kind=="boss")N(90,45,1,"sawtooth",.3);
  else if(kind=="win"){N(523,523,.15,"sine",.15);setTimeout(()=>sfx("win2"),160)}
  else if(kind=="win2")N(784,784,.3,"sine",.15);
  else if(kind=="lose")N(400,60,.9,"sawtooth",.22);
}
// ---------- world ----------

const PATH=[[0,1],[7,1],[7,4],[1,4],[1,7],[7,7],[7,10],[1,10],[1,12],[8,12]];

{const sky=new THREE.Mesh(new THREE.SphereGeometry(160,24,16),new THREE.MeshBasicMaterial({map:skyTex(),side:THREE.BackSide,fog:false}));scene.add(sky)}
scene.add(new THREE.HemisphereLight(0xcfe5ff,0x3d5a35,.85));

sun.shadow.mapSize.set(2048,2048);

scene.add(sun);scene.add(sun.target);
const cam=new THREE.PerspectiveCamera(46,1,.1,300);

const tileGeo=new THREE.BoxGeometry(CS*.96,.5,CS*.96);

const cells=[];

  const isP=pathCells.has(c+","+r);
  const m=new THREE.Mesh(tileGeo,isP?new THREE.MeshLambertMaterial({color:0x8a744f}):(((c*7+r*3)%5<2)?gM:gM2));

  m.userData={c,r,path:isP};scene.add(m);cells.push(m);
}
// road ribbon along curve
{
  const pts=curve.getSpacedPoints(160),half=.85,vs=[],idx=[];
  for(let i=0;i<pts.length;i++){
    const p=pts[i],t=curve.getTangentAt(i/(pts.length-1));

{

{

{

function waveComp(w){
  const q=[];
  const push=(t,n)=>{for(let i=0;i<n;i++)q.push(t)};
  if(w==1)push("grunt",6);
  else if(w==2){push("grunt",8);push("runner",2)}
  else if(w==3){push("grunt",8);push("runner",5)}
  else if(w==4){push("grunt",6);push("runner",6);push("brute",2)}
  else if(w==5){push("runner",10);push("shield",4);push("grunt",6)}
  else if(w==6){push("flyer",7);push("grunt",8);push("runner",4)}
  else if(w==7){push("brute",4);push("shield",5);push("healer",2);push("grunt",8)}
  else if(w==8){push("boss",1);push("grunt",8);push("runner",6)}
  else if(w==9){push("flyer",10);push("runner",8);push("healer",2)}
  else if(w==10){push("brute",6);push("shield",6);push("healer",3);push("flyer",4)}
  else if(w==11){push("runner",16);push("flyer",8);push("brute",3)}
  else if(w==12){push("shield",10);push("healer",4);push("grunt",12)}
  else if(w==13){push("flyer",14);push("brute",6);push("healer",3)}
  else if(w==14){push("brute",8);push("shield",8);push("healer",5);push("runner",10)}

  return q;
}

function chainZap(from,e,dmg,chain){
  sfx("zap");
  let cur=e,prev=from,hit=new Set();
  for(let i=0;i<=chain&&cur;i++){
    // lightning bolt: jagged line
    const pts=[prev.clone()];
    const target=cur.m.position.clone();target.y+=.6;
    for(let k=1;k<5;k++){const p=prev.clone().lerp(target,k/5);p.x+=(Math.random()-.5)*.5;p.y+=(Math.random()-.5)*.5;p.z+=(Math.random()-.5)*.5;pts.push(p)}
    pts.push(target);
    const g=new THREE.BufferGeometry().setFromPoints(pts);
    const line=new THREE.Line(g,new THREE.LineBasicMaterial({color:0xfde047,transparent:true}));
    scene.add(line);parts.push({m:line,v:null,l:.15,tl:.15,line:true});
    damage(cur,dmg*(i==0?1:.7));
    burst(target,0xfde047,3,2);
    hit.add(cur);prev=target;
    let best=null,bd=3.4;
    for(const o of enemies){if(o.dead||hit.has(o)||o.delay>0)continue;
      const dd=o.m.position.distanceTo(cur.m.position);if(dd<bd){bd=dd;best=o}}
    cur=best;
  }
}

  if(e.dead)return;
  e.hp-=amt;dmgDealt+=amt;
  e.fg.scale.x=clamp(e.hp/e.max,0,1);e.fg.position.x=-(1-e.fg.scale.x)*.63;
  e.fg.material.color.setHex(e.hp/e.max>.5?0x22c55e:e.hp/e.max>.25?0xfacc15:0xef4444);
  if(amt>=25||crit)floatText(e.m.position,AR(amt),crit?"#f472b6":"#fde047");
  if(e.hp<=0)kill(e);
}
function kill(e){
  e.dead=true;kills++;gold+=e.d.gold;goldEarned+=e.d.gold;
  sfx(e.d.boss?"boom":"coin",e.d.boss?1:.5);
  burst(e.m.position,e.d.col,e.d.boss?30:10,e.d.boss?8:4);
  if(e.d.boss){bossAlive=false;shake=Math.max(shake,1);bannerShow("💀 الزعيم مات! +"+AR(e.d.gold));sfx("win")}
  scene.remove(e.m);scene.remove(e.hbG);
  hud();
}
function meteorAt(p){
  abMeteor.cd=abMeteor.max;mkBar();
  const m=new THREE.Mesh(new THREE.SphereGeometry(.7,10,8),new THREE.MeshBasicMaterial({color:0xff7b1c}));
  m.position.set(p.x+6,24,p.z+4);scene.add(m);
  shots.push({kind:"meteor",m,target:p.clone(),spd:22});
}
function explodeAt(p,radius,dmg){
  sfx("boom");shake=Math.max(shake,.55);
  const ring=new THREE.Mesh(new THREE.RingGeometry(.2,.9,32),new THREE.MeshBasicMaterial({color:0xffb066,side:2,transparent:true,opacity:.95,depthWrite:false}));
  ring.rotation.x=-Math.PI/2;ring.position.set(p.x,.12,p.z);scene.add(ring);
  parts.push({m:ring,v:null,l:.45,tl:.45,ring:radius});
  burst(p,0xff7b1c,22,8);burst(p,0x444444,10,5);
  for(const e of enemies){if(e.dead||e.delay>0)continue;
    if(e.m.position.distanceTo(p)<=radius+(e.d.fly?-.3:0)&&!e.d.fly)damage(e,dmg);
  }
  hud();
}
// tower firing
function fireTower(tw,dt){
  const t=TW[tw.type],cur=t.lv[tw.lv-1];
  tw.cd-=dt;if(tw.cd>0)return;
  // acquire
  let best=null,bestKey=-1e9;
  for(const e of enemies){
    if(e.dead||e.delay>0)continue;
    if(e.d.fly&&!t.canFly)continue;
    const d=e.m.position.distanceTo(tw.m.position);
    if(d>cur.range)continue;
    let key;
    if(tw.mode=="strong")key=e.hp;
    else if(tw.mode=="close")key=-d;
    else key=e.dist;
    if(key>bestKey){bestKey=key;best=e}
  }
  if(!best){tw.cd=.08;return}
  tw.cd=1/cur.rate;
  const from=tw.m.position.clone();from.y+=1.4;
  // aim barrel
  const br=tw.m.userData.barrel;
  if(br){const dir=best.m.position.clone().sub(tw.m.position);tw.m.rotation.y=Math.atan2(dir.x,dir.z)}
  if(tw.type=="tesla"){chainZap(from,best,cur.dmg,cur.chain);return}
  if(tw.type=="sniper"){
    sfx("shoot");
    const g=new THREE.BufferGeometry().setFromPoints([from,best.m.position.clone().setY(best.m.position.y+.5)]);
    const line=new THREE.Line(g,new THREE.LineBasicMaterial({color:0xe879f9,transparent:true}));
    scene.add(line);parts.push({m:line,v:null,l:.12,tl:.12,line:true});
    burst(best.m.position,t.col,4,2);damage(best,cur.dmg,Math.random()<.15);
    return;
  }
  // projectiles
  const arch=tw.type=="archer",frost=tw.type=="frost",mort=tw.type=="mortar";
  const geo=arch?new THREE.ConeGeometry(.07,.4,5):frost?new THREE.IcosahedronGeometry(.16):mort?new THREE.SphereGeometry(.28,8,6):new THREE.SphereGeometry(.2,8,6);
  const m=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color:frost?0x7dd3fc:mort?0xfb7185:arch?0xd9f99d:0xffa726}));
  m.position.copy(from);scene.add(m);
  shots.push({kind:mort?"arc":arch?"dart":frost?"bolt":"shell",m,target:best,src:from.clone(),t:0,dur:arch?.35:mort?.9:frost?.4:.5,dmg:cur.dmg,tw:tw.type,cur});
  sfx(arch?"arrow":mort?"boom":"shoot",.6);
}
// ---------- updates ----------
const tmpV=new V3();
function updateEnemies(dt){
  for(const e of enemies){
    if(e.dead)continue;
    if(e.delay>0){e.delay-=dt;e.m.visible=e.delay<=0;e.hbG.visible=e.m.visible;continue}
    if(e.stun>0){e.stun-=dt;if(Math.random()<dt*4)burst(e.m.position,0x7dd3fc,1,1)}
    else{
      const sp=e.spd*(e.slowT>0?1-e.slow:1);
      e.dist+=sp*dt/PATHLEN*60; // dist in arbitrary progress units
      e.prog=(e.prog||0)+sp*dt/PATHLEN;
      if(e.slowT>0)e.slowT-=dt;
      if(e.prog>=1){ // leaked
        e.dead=true;lives-=e.d.dmg;scene.remove(e.m);scene.remove(e.hbG);
        sfx("leak");shake=Math.max(shake,.6);
        $("vign").classList.add("hurt");setTimeout(()=>$("vign").classList.remove("hurt"),300);
        say(e.d.boss?"الزعيم دخل القلعة!! 😱":"-"+AR(e.d.dmg)+" ❤️",900);
        hud();
        if(lives<=0){gameOver(false);return}
        continue;
      }
      const p=curve.getPointAt(clamp(e.prog,0,1)),tg=curve.getTangentAt(clamp(e.prog,0,.999));
      e.m.position.set(p.x,e.d.fly?2.2+Math.sin(e.bob)*.2:.0,p.z);
      e.m.rotation.y=Math.atan2(tg.x,tg.z);
      e.bob+=dt*8;
      if(!e.d.fly&&!e.d.boss){e.m.children[0].position.y=.62+Math.abs(Math.sin(e.bob))*.1}
      if(e.m.userData.wings){e.m.userData.wings[0].rotation.z=Math.sin(e.bob*2)*.6;e.m.userData.wings[1].rotation.z=-Math.sin(e.bob*2)*.6}
      if(e.m.userData.halo){e.m.userData.halo.rotation.z+=dt*2}
      if(e.m.userData.core){e.m.userData.core.rotation.y+=dt*3}
      // healer aura
      if(e.d.heals){e.healT-=dt;if(e.healT<=0){e.healT=1.2;
        for(const o of enemies){if(!o.dead&&o!=e&&o.hp<o.max&&o.m.position.distanceTo(e.m.position)<3){o.hp=Math.min(o.max,o.hp+25);
          burst(o.m.position,0x4ade80,2,2)}}}}
      // shield regen flavor
    }
    e.hbG.position.copy(e.m.position);e.hbG.position.y+=e.d.fly?1.1:1.75*e.d.scale+.4;
    e.hbG.quaternion.copy(cam.quaternion);
  }
  enemies=enemies.filter(e=>!(e.dead&&scene.getObjectById(e.m.id)==null));
}
function updateShots(dt){
  for(const s of shots){
    if(s.kind=="meteor"){
      const dir=s.target.clone().sub(s.m.position);
      const d=dir.length(),step=s.spd*dt;
      if(d<=step){scene.remove(s.m);s.done=true;explodeAt(s.target,2.8,320)}
      else s.m.position.addScaledVector(dir.normalize(),step);
      continue;
    }
    s.t+=dt/s.dur;
    const tgt=s.target;
    const tp=(tgt&&!tgt.dead)?tgt.m.position.clone():s.lastPos;
    if(!tp){s.done=true;scene.remove(s.m);continue}
    s.lastPos=tp.clone();
    tp.y+=tgt&&tgt.d.fly?0:.5;
    const t0=clamp(s.t,0,1);
    const pos=s.src.clone().lerp(tp,t0);
    if(s.kind=="arc"||s.kind=="shell")pos.y+=Math.sin(t0*Math.PI)*(s.kind=="arc"?3.2:1.2);
    s.m.position.copy(pos);
    if(s.t>=1){
      s.done=true;scene.remove(s.m);
      if(s.kind=="dart"||s.kind=="bolt"){
        if(tgt&&!tgt.dead){
          damage(tgt,s.dmg);
          if(s.tw=="frost"){tgt.slow=Math.max(tgt.slow,s.cur.slow);tgt.slowT=Math.max(tgt.slowT,s.cur.slowT);burst(tp,0x7dd3fc,3,2)}
        }
      }else{ // shell / mortar splash
        explodeAt(tp,s.cur.splash,s.dmg);
        if(s.tw=="mortar")for(const e of enemies){if(!e.dead&&e.m.position.distanceTo(tp)<=s.cur.splash)e.stun=Math.max(e.stun,s.cur.stun)}
      }
    }
  }
  shots=shots.filter(s=>!s.done);
}
function updateParts(dt){
  for(const p of parts){
    p.l-=dt;
    if(p.line){p.m.material.opacity=Math.max(p.l/p.tl,0)}
    else if(p.ring){const k=1-p.l/p.tl;p.m.scale.setScalar(1+k*p.ring);p.m.material.opacity=(1-k)*.9}
    else{p.m.position.addScaledVector(p.v,dt);p.v.y-=12*dt;p.m.material.opacity=Math.max(p.l/p.tl,0);p.m.material.transparent=true}
    if(p.l<=0){scene.remove(p.m);p.gone=true}
  }
  parts=parts.filter(p=>!p.gone);
  for(const f of floats){f.l-=dt;f.s.position.y+=dt*1.2;f.s.material.opacity=Math.max(f.l/f.tl,0);
    if(f.l<=0){scene.remove(f.s);f.gone=true}}
  floats=floats.filter(f=>!f.gone);
}
function updateTowers(dt){
  for(const tw of towers){
    fireTower(tw,dt);
    if(tw.m.userData.orb){tw.m.userData.orb.rotation.y+=dt*3;tw.m.userData.orb.position.y+=Math.sin(clockT*3)*dt*.3}
  }
}
// ambient animation
let clockT=0;
function updateAmbient(dt){
  clockT+=dt;
  for(const f of flames){f.scale.y=1+Math.sin(clockT*11+f.position.x)*.25;f.scale.x=1+Math.cos(clockT*13)*.15}
  for(const fl of flags){const pos=fl.geometry.attributes.position;
    for(let i=0;i<pos.count;i++){const x=pos.getX(i);pos.setZ(i,Math.sin(clockT*6+x*4)*.08*(x+.5))}
    pos.needsUpdate=true}
  if(scene.userData.caveGlow)scene.userData.caveGlow.material.opacity=.35+Math.sin(clockT*2.5)*.2;
  if(msgT>0){msgT-=dt;if(msgT<=0)$("msg").style.opacity=0}
  // ability cooldown ticks refresh bar
  const hadCd=abMeteor.cd>0||abFreeze.cd>0;
  abMeteor.cd=Math.max(0,abMeteor.cd-dt);abFreeze.cd=Math.max(0,abFreeze.cd-dt);
  if(hadCd&&(abMeteor.cd<=0||abFreeze.cd<=0||Math.floor(clockT*2)%2==0))mkBar();
}
function waveDoneCheck(){
  if(inWave&&queue.length==0&&enemies.filter(e=>!e.dead).length==0&&!bossAlive){
    inWave=false;
    const bonus=30+wave*8;gold+=bonus;goldEarned+=bonus;
    sfx("win");say("الموجة خلصت! +"+AR(bonus)+" 💰");
    if(wave>=15){gameOver(true);return}
    hud();mkBar();
  }
}
// ---------- game flow ----------
function newGame(){
  for(const e of enemies){scene.remove(e.m);scene.remove(e.hbG)}
  for(const t of towers)scene.remove(t.m);
  for(const s of shots)scene.remove(s.m);
  for(const p of parts)scene.remove(p.m);
  for(const f of floats)scene.remove(f.s);
  for(const c of cells)c.userData.taken=false;
  enemies=[];towers=[];shots=[];parts=[];floats=[];queue=[];
  gold=220;lives=20;wave=0;kills=0;dmgDealt=0;goldEarned=0;inWave=false;state="play";speedMul=1;paused=false;bossAlive=false;
  abMeteor.cd=0;abFreeze.cd=0;buildType=null;closePop();
  $("end").classList.remove("on");$("start").classList.remove("on");$("pause").classList.remove("on");
  hud();mkBar();say("ابني أبراجك ثم ابدأ الموجة الأولى 🏰",2500);
}
function gameOver(win){
  state="over";saveHs();
  const h=hs();
  $("et").textContent=win?"🏆 انتصار أسطوري!":"💔 وقعت القلعة…";
  $("est").innerHTML="<div><b>"+AR(wave)+"</b>موجة</div><div><b>"+AR(kills)+"</b>قتلة</div><div><b>"+AR(dmgDealt)+"</b>ضرر</div><div><b>"+AR(goldEarned)+"</b>ذهب</div>";
  $("ep").innerHTML=(win?"صديت الموجات الـ ١٥ كلها، أنت رسميًا حارس القلعة الأسطوري! ":"وصلت للموجة "+AR(wave)+" من ١٥. ")+"أحسن نتيجة: موجة "+AR(h.wave)+" ☠ "+AR(h.kills);
  $("end").classList.add("on");
  sfx(win?"win":"lose");
}
$("go").onclick=()=>{audio();newGame()};
$("again").onclick=()=>{audio();newGame()};
$("resume").onclick=()=>{paused=false;$("pause").classList.remove("on")};
// spawn scheduling within update
function spawner(dt){
  if(!inWave||queue.length==0)return;
  spT-=dt;
  if(spT<=0){
    const t=queue.shift();
    spawnEnemy(t);
    spT=(EN[t].boss?1.5:.55)*clamp(1.2-wave*.04,.5,1.2);
    hud();
  }
}
// ---------- resize / camera ----------
function resize(){
  const w=innerWidth,h=innerHeight;
  renderer.setSize(w,h);cam.aspect=w/h;
  const mob=w<h;
  camBase.set(0,mob?30:26,mob?24:20.5);
  cam.position.copy(camBase);cam.lookAt(camLook);
  cam.updateProjectionMatrix();
}
addEventListener("resize",resize);resize();
// ---------- main loop ----------
const clock=new THREE.Clock();
let acc=0;
function loop(){
  requestAnimationFrame(loop);
  const raw=Math.min(clock.getDelta(),.1);
  const dt=(state=="play"&&!paused)?raw*speedMul:0;
  if(dt>0){
    spawner(dt);
    updateEnemies(dt);
    if(state!="play"){renderer.render(scene,cam);return}
    updateTowers(dt);
    updateShots(dt);
    updateParts(dt);
    waveDoneCheck();
  }
  updateAmbient(raw);
  // camera shake
  if(shake>0){shake=Math.max(0,shake-raw*1.4);
    cam.position.set(camBase.x+(Math.random()-.5)*shake,camBase.y+(Math.random()-.5)*shake*.6,camBase.z+(Math.random()-.5)*shake);
    cam.lookAt(camLook);
  }else if(cam.position.x!=camBase.x){cam.position.copy(camBase);cam.lookAt(camLook)}
  renderer.render(scene,cam);
}
loop();
// menu highscore
{const h=hs();if(h.wave>0)$("hsline").textContent="🏅 أحسن نتيجة: موجة "+AR(h.wave)+" — ☠ "+AR(h.kills)}
// debug/testing hook
window.__g=()=>({state,wave,lives,gold,kills,en:enemies.filter(e=>!e.dead).length,tw:towers.length,q:queue.length,inWave,parts:parts.length,shots:shots.length});
window.__tap=(c,r)=>{const cell=cells.find(x=>x.userData.c==c&&x.userData.r==r);if(buildType){tryBuild(c,r);buildType=null;mkBar()}return !!cell};
window.__setBuild=k=>{buildType=k};
window.__enemies=()=>enemies.slice(0,3).map(e=>({t:e.t,prog:e.prog,delay:e.delay,stun:e.stun,vis:e.m.visible,pos:e.m.position.toArray().map(x=>Math.round(x*10)/10)}));
window.__pathlen=PATHLEN;
window.__cellScreen=(c,r)=>{const p=cellPos(c,r).clone().project(cam);return{x:(p.x+1)/2*innerWidth,y:(-p.y+1)/2*innerHeight}};
window.__set=(k,v)=>{if(k=='wave')wave=v;else if(k=='gold')gold=v;else if(k=='lives')lives=v;else if(k=='speed')speedMul=v;hud()};
window.__startWave=startWave;
window.__towers=()=>towers.map(t=>({type:t.type,lv:t.lv,c:t.c,r:t.r}));
</script>
